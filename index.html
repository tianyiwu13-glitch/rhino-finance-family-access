<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>视野环球财经 · 备用入口测试</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;background:#f3f6f2;color:#162c25;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:48px 20px;display:grid;place-items:center}
    main{width:100%;max-width:520px;background:white;border:1px solid #dce5dc;border-radius:24px;padding:36px 26px;box-shadow:0 12px 44px #173b2010}
    .brand{margin:0 0 28px;font-weight:650;font-size:18px;letter-spacing:.04em}
    .badge{display:inline-block;padding:7px 12px;border-radius:100px;background:#eaf3eb;color:#386346;font-size:13px}
    h1{margin:24px 0 16px;font-size:clamp(28px,7vw,38px);line-height:1.3;letter-spacing:-.02em}
    p{font-size:16px;line-height:1.9;margin:0 0 20px;color:#4c6058;overflow-wrap:anywhere}
    .success{background:#f3f7f2;border-radius:14px;padding:18px;margin-top:26px;color:#234b34}
    footer{border-top:1px solid #e4eae3;margin-top:28px;padding-top:20px;font-size:13px;line-height:1.8;color:#77857d}
    @media(max-width:380px){body{padding:24px 14px}main{padding:28px 22px}}
  </style>
</head>
<body>
  <main>
    <p class="brand">视野环球财经</p>
    <span class="badge">备用入口 · 连通性测试</span>
    <h1>这个页面可以打开吗？</h1>
    <p>如果你能看到这段文字，说明你的手机已经能够访问这个备用入口。</p>
    <p class="success">请把“已打开”告诉分享网址给你的家人。</p>
    <footer>这是访问测试页，暂不展示股票观点。<br>准备日期：2026年10月12日（日本时间）</footer>
  </main>
</body>
</html>
